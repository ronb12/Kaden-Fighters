<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="g" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1b0b0b"/>
      <stop offset="55%" stop-color="#0b0b0c"/>
      <stop offset="100%" stop-color="#040405"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050506" stop-opacity="0.0"/>
      <stop offset="55%" stop-color="#0a0a0c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#060607" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7d0e0e" stop-opacity="0.0"/>
      <stop offset="35%" stop-color="#7d0e0e" stop-opacity="0.25"/>
      <stop offset="65%" stop-color="#7d0e0e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7d0e0e" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Base atmosphere -->
  <rect width="1280" height="720" fill="url(#g)"/>

  <!-- Back wall frame -->
  <rect x="90" y="70" width="1100" height="470" rx="18" fill="#060607" stroke="#2b0f10" stroke-width="6" opacity="0.9"/>
  <rect x="120" y="95" width="1040" height="420" rx="14" fill="#050506" stroke="#1b1416" stroke-width="2" opacity="0.8"/>

  <!-- Side pillars -->
  <g opacity="0.9">
    <rect x="130" y="110" width="70" height="430" fill="#09090a"/>
    <rect x="1080" y="110" width="70" height="430" fill="#09090a"/>
    <rect x="130" y="110" width="70" height="430" fill="url(#beam)" opacity="0.22"/>
    <rect x="1080" y="110" width="70" height="430" fill="url(#beam)" opacity="0.22"/>
  </g>

  <!-- Lantern glow blobs -->
  <g filter="url(#soft)">
    <circle cx="260" cy="170" r="90" fill="#7d0e0e" opacity="0.22"/>
    <circle cx="1020" cy="190" r="110" fill="#7d0e0e" opacity="0.18"/>
    <circle cx="640" cy="145" r="140" fill="#c18a2b" opacity="0.06"/>
  </g>

  <!-- Subtle smoke strokes -->
  <g opacity="0.16" fill="none" stroke="#bdbdbd" stroke-width="2">
    <path d="M140 260 C 260 200, 420 240, 560 210 S 860 210, 1140 250" opacity="0.25"/>
    <path d="M120 315 C 280 280, 420 360, 620 310 S 940 290, 1160 330" opacity="0.22"/>
    <path d="M160 380 C 320 340, 470 430, 660 390 S 980 360, 1120 420" opacity="0.18"/>
  </g>

  <!-- Floor vignette -->
  <rect y="430" width="1280" height="290" fill="url(#floor)"/>
  <path d="M0 560 L1280 560" stroke="#1f1f22" stroke-width="6" opacity="0.5"/>

  <!-- Center empty spotlight (keeps title readable) -->
  <ellipse cx="640" cy="300" rx="360" ry="220" fill="#000" opacity="0.28"/>
</svg>

